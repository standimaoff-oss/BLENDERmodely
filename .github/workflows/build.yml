name: Build Octo Arms

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain build 2>&1 | tee build.log

      - name: Publish build log on failure
        if: steps.build.outcome == 'failure' || failure()
        run: |
          mkdir -p ci-debug
          tail -n 500 build.log > ci-debug/build.log || true
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add ci-debug/build.log
          git commit -m "ci: publish failing build log [skip ci]" || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

      - name: Fail the run if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build failed - see ci-debug/build.log committed to the branch"
          exit 1

      - name: Rename jar
        run: |
          mkdir -p dist
          cp build/libs/octoarms-*.jar dist/ || true
          ls -la dist build/libs

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: octoarms-jar
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish jar to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="latest-build"
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          FORGE=$(grep '^forge_version=' gradle.properties | cut -d'=' -f2)
          JAR=$(ls dist/octoarms-*.jar | head -n 1)
          cp "$JAR" "dist/octoarms-${VERSION}-mc${MC}-forge${FORGE}.jar"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/octoarms-${VERSION}-mc${MC}-forge${FORGE}.jar" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "dist/octoarms-${VERSION}-mc${MC}-forge${FORGE}.jar" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Octo Arms ${VERSION} (Minecraft ${MC} / Forge ${FORGE})" \
              --notes "Automatic build from branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Download the jar and drop it into your mods folder."
          fi

      - name: Commit jar to the branch
        run: |
          set -e
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          FORGE=$(grep '^forge_version=' gradle.properties | cut -d'=' -f2)
          mkdir -p jar
          cp "dist/octoarms-${VERSION}-mc${MC}-forge${FORGE}.jar" jar/
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -f jar/
          git commit -m "ci: publish built jar [skip ci]" || echo "jar unchanged, nothing to commit"
          git push origin HEAD:"${GITHUB_REF_NAME}" || true
