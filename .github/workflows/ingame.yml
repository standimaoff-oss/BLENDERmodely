name: In-game smoke test (headless)

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'tools/ci_play.sh'
      - '.github/workflows/ingame.yml'

permissions:
  contents: write

env:
  DISPLAY: ':99'
  LIBGL_ALWAYS_SOFTWARE: '1'
  GALLIUM_DRIVER: 'llvmpipe'

jobs:
  play:
    name: Launch Minecraft (Xvfb + llvmpipe), play, screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Install Xvfb, Mesa llvmpipe, xdotool
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb xdotool libgl1-mesa-dri libgl1 libglx-mesa0 \
            libxrandr2 libxcursor1 libxi6 libxinerama1 libxkbcommon0 mesa-utils

      - name: Prepare game options (low settings for software rendering)
        run: |
          mkdir -p run
          cat > run/options.txt <<'EOF'
          version:3465
          autoJump:false
          enableVsync:false
          renderDistance:2
          simulationDistance:5
          entityDistanceScaling:0.5
          guiScale:2
          particles:1
          maxFps:60
          graphicsMode:0
          ao:false
          biomeBlendRadius:0
          renderClouds:"false"
          mipmapLevels:0
          forceUnicodeFont:false
          fullscreen:false
          overrideWidth:1280
          overrideHeight:720
          tutorialStep:none
          skipMultiplayerWarning:true
          joinedFirstServer:true
          hideServerAddress:false
          lang:en_us
          narrator:0
          onboardAccessibility:false
          realmsNotifications:false
          showAutosaveIndicator:true
          pauseOnLostFocus:false
          EOF
          cat run/options.txt | head -5

      - name: Prepare test world (level.dat with cheats + creative)
        run: python3 tools/make_test_world.py run OctoTest

      - name: Start Xvfb on :99 (1280x720x24)
        run: |
          nohup Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > xvfb.log 2>&1 &
          sleep 3
          glxinfo -B || true

      - name: Launch Minecraft client with the mod (background)
        run: |
          chmod +x ./gradlew
          nohup ./gradlew --no-daemon runClient > client-run.log 2>&1 &
          echo "gradlew runClient started in background"

      - name: Drive the game with xdotool (menus, world, F2 screenshots)
        timeout-minutes: 40
        continue-on-error: true
        run: bash tools/ci_play.sh

      - name: Stop the client
        if: always()
        run: |
          pkill -f BootstrapLauncher || true
          pkill -f GradleWrapperMain || true
          pkill -f GradleDaemon || true
          pkill java || true
          sleep 5

      - name: Summarize, commit screenshots and logs
        if: always()
        run: |
          RUN_TAG="$(date -u +%Y%m%d-%H%M%S)"
          mkdir -p "shots/$RUN_TAG" ci-debug
          cp run/screenshots/*.png "shots/$RUN_TAG/" 2>/dev/null || true
          cp run/logs/latest.log "shots/$RUN_TAG/latest.log" 2>/dev/null || true
          tail -n 1500 client-run.log > ci-debug/client-run.log 2>/dev/null || true
          cp ci-play.log "shots/$RUN_TAG/" 2>/dev/null || true
          ls -la "shots/$RUN_TAG" || true
          echo "=== octoarms log evidence ==="
          grep -i "octoarms" client-run.log | head -40 || true
          echo "=== errors/crashes ==="
          grep -iE "crash|fatal|exception|error" client-run.log | grep -viE "errorprone|error_prone" | head -40 || true
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add -f shots ci-debug
          git commit -m "ci: in-game screenshots $RUN_TAG [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && break
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 10
          done

      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingame-screenshots
          path: |
            run/screenshots/*.png
            ci-play.log
          if-no-files-found: warn

      - name: Fail if the game never produced a screenshot
        run: |
          COUNT=$(ls run/screenshots/*.png 2>/dev/null | wc -l)
          echo "screenshots captured: $COUNT"
          test "$COUNT" -ge 1
